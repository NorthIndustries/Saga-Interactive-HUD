name: Build and Release Saga Interactive HUD
on:
  push:
    branches: master
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Static verify
        run: |
          chmod +x scripts/*.sh
          ./scripts/verify.sh

      - name: Build artifacts
        if: github.ref == 'refs/heads/master'
        run: ./scripts/build.sh

      - name: Create Release Notes
        if: github.ref == 'refs/heads/master'
        run: |
          cat > ReleaseNotes.md <<'EOF'
          Saga Interactive HUD v4.0 Alpha (North Industries) with bundled MyDU planet data.

          Compiled from developer Saga AP HUD 4.0 Alpha source.

          - **Saga-Interactive-HUD.zip** — recommended modular install
          - **Saga-Interactive-HUD.conf** — conf only (needs atlas from zip)
          - **Saga-Interactive-HUD-GFN.conf** — atlas embedded in conf

          See INSTALL.md in the repository.
          EOF

      - name: Create Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0-ni.1
          name: Saga Interactive HUD v4.0 Alpha (North Industries) v4.0-ni.1
          body_path: ReleaseNotes.md
          files: |
            Saga-Interactive-HUD.zip
            Saga-Interactive-HUD.conf
            Saga-Interactive-HUD-GFN.conf
